[install]
exact = true
# Scripts run as `bun <script>` from the checkout: never install a missing import on the fly.
auto = "disable"
# Three days, so a compromised release is usually pulled before it lands here.
# @types/bun and bun-types follow the installed Bun and typescript is pinned, so they skip the wait.
minimumReleaseAge = "3d"
minimumReleaseAgeExcludes = ["@types/bun", "bun-types", "typescript"]
