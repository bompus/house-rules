name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('check-pr-{0}', github.event.pull_request.number) || format('check-{0}', github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Composer and eval grader
        run: node --test test/*.test.mjs
      - name: Composer and eval grader under Bun
        run: |
          bun test test/
          bun compose.mjs --config examples/person/house-rules.json \
            --out "$RUNNER_TEMP/rules.md" --skills-out "$RUNNER_TEMP/composed-skills"
      - name: npm tarball
        run: npm run check:package -- --bun
      - name: Skill scripts
        run: bun test skills/
      - parallel:
          - name: Lint
            run: npx --yes oxlint@1.85.0 .
          - name: Format
            run: npx --yes oxfmt@0.70.0 --check .

  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Composer, eval runner and grader, and install.ps1
        run: node --test test/*.test.mjs
      - name: The same under Bun
        run: bun test test/
      - name: npm tarball
        run: npm run check:package -- --bun
      - name: Skill scripts
        run: bun test skills/
      - name: Skill scripts that use node:test, under Node
        run: node --test skills/hr-code-review/test/acp-client.test.mjs
