name: Panel board refresh

# Weekly: refetch the public Bug Hunt board for the panel recommendations catalog and, only when it changed,
# push the regenerated snapshot and catalog to the branch panel-board-refresh and log its URL. The job opens no
# pull request (this repository does not allow Actions to create them): a maintainer opens one from the branch.
# Own results never enter this job (a fetch keeps the catalog's own entries). The job runs the catalog check
# and the skill tests itself before it pushes, because a branch pushed with the workflow token starts no CI.

on:
  schedule:
    - cron: "17 14 * * 1" # Monday 14:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: panel-board-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'bompus/house-rules'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      BRANCH: panel-board-refresh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Always main, even for a manual run started from another branch, and the whole history, so the
          # publish step can tell which commits the refresh branch has that main lacks.
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Refetch the board and check the result
        id: refresh
        run: bash scripts/refresh-panel-board.sh
      # The write token reaches only this step, never the install, the board fetch or the tests.
      - name: Put the result on the refresh branch
        id: publish
        if: steps.refresh.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          bash scripts/publish-panel-board.sh
          echo "The refresh branch holds the new board: https://github.com/${GITHUB_REPOSITORY}/tree/${BRANCH}" | tee -a "$GITHUB_STEP_SUMMARY"
