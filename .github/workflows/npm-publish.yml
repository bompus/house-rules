name: npm publish

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
      - name: Verify release boundary
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          assert.equal(process.env.RELEASE_TAG, `v${version}`);
          assert.match(version, /^\d+\.\d+\.\d+$/);
          const prefix = `## ${version} - `;
          const entry = readFileSync('CHANGELOG.md', 'utf8').split(/\r?\n/).find(line => line.startsWith(prefix));
          const date = entry?.slice(prefix.length);
          assert.match(date ?? '', /^\d{4}-\d{2}-\d{2}$/, 'Missing complete dated release heading');
          assert.equal(new Date(`${date}T00:00:00Z`).toISOString().slice(0, 10), date, 'Invalid release date');
          JS
      - name: Verify tarball
        env:
          HOUSE_RULES_TEST_TMP: ${{ runner.temp }}
        run: npm run check:package -- --out "$RUNNER_TEMP/npm-artifact"
      - name: Check prior publication
        id: registry
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { appendFileSync, readFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          const { name, version } = JSON.parse(readFileSync('package.json', 'utf8'));
          const response = await fetch(`https://registry.npmjs.org/${encodeURIComponent(name)}/${version}`);
          if (response.status === 404) {
            appendFileSync(process.env.GITHUB_OUTPUT, 'published=false\n');
          } else {
            assert(response.ok, `Registry returned ${response.status}`);
            const existing = await response.json();
            const tarball = readFileSync(`${process.env.RUNNER_TEMP}/npm-artifact/house-rules.tgz`);
            const integrity = `sha512-${createHash('sha512').update(tarball).digest('base64')}`;
            assert.equal(existing.dist.integrity, integrity, 'Published version has different bytes');
            appendFileSync(process.env.GITHUB_OUTPUT, 'published=true\n');
          }
          JS
      - name: Publish verified tarball
        if: steps.registry.outputs.published != 'true'
        run: npm publish "$RUNNER_TEMP/npm-artifact/house-rules.tgz" --access public
